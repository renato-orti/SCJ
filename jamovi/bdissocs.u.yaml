---
name: bdissocs
title: Bayesian Dissociation Test
jus: '3.0'
compilerMode: tame

children:
  # ---- Paired Task Parameters (Isolated Two-Column Grid) ----
  - type: LayoutBox
    margin: normal
    children:
      - type: LayoutBox
        cell: { column: 0, row: 0 }
        children:
          - type: Label
            label: Task A parameters
            children:
              - type: TextBox
                name: case_a
                format: number
              - type: TextBox
                name: controls_a
                format: number
              - type: TextBox
                name: sd_a
                format: number

      - type: LayoutBox
        cell: { column: 1, row: 0 }
        children:
          - type: Label
            label: Task B parameters
            children:
              - type: TextBox
                name: case_b
                format: number
              - type: TextBox
                name: controls_b
                format: number
              - type: TextBox
                name: sd_b
                format: number

  # ---- Control Sample & Hypotheses (Linear Vertical Layout) ----
  - type: LayoutBox
    margin: large
    children:
      - type: Label
        label: Control sample statistics
        children:
          - type: TextBox
            name: sample_size
            format: number
          - type: TextBox
            name: correlation
            format: number

      - type: Label
        label: Hypothesis testing
        children:
          - type: ComboBox
            name: alternative_a
          - type: ComboBox
            name: alternative_b

      # ---- Standardised Scores ----
      - type: Label
        label: Score scaling
        children:
          - type: CheckBox
            name: unstandardised

  # ---- Advanced Simulation Options ----
  - type: CollapseBox
    label: Simulation
    collapsed: true
    children:
      - type: LayoutBox
        margin: normal
        children:
          - type: CheckBox
            name: credible_interval
          - type: TextBox
            name: credible_level
            format: number
            enable: (credible_interval)
          - type: TextBox
            name: iter
            format: number
          - type: TextBox
            name: seed
            format: number

  # ---- Additional Output ----
  - type: CollapseBox
    label: Additional output
    collapsed: true
    children:
      - type: LayoutBox
        margin: normal
        children:
          - type: CheckBox
            name: show_plot