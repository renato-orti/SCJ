# =================================================================================================
# Module:    DISSOCS - Single Case Comparison
# File:      dissocs.a.yaml (UI Configuration)
# Purpose:   Graphical user interface for executing single-case deficit tests
#            using the singcar package (Rittmo & McIntosh, 2021) in Jamovi.
# 
# Authors:
#
#   - Michela Possenti
#     Affiliation: University of Campania "L. Vanvitelli"
#     ORCID: https://orcid.org/0000-0001-8937-0611 | Scopus ID: 57215597427
#
#   - Renato Orti
#     Affiliation: University of Padova
#     ORCID: https://orcid.org/0000-0002-6856-7981 | Scopus ID: 57218222421
#
# References:
#   - Crawford, J. R. & Garthwaite, P.H. (2005). Testing for suspected impairments and dissociations 
#     in single-case studies in neuropsychology: Evaluation of alternatives using Monte Carlo 
#     simulations and revised tests for dissociations”.  Neuropsychology, 19, 318-331.
#     https://doi.org/10.1037/0894-4105.19.3.318
#
#   - Rittmo J.Ö., & McIntosh R.D. (2021). singcar: Comparing single cases 
#     to small samples in R. Journal of Open Source Software, 6(68), 3887. 
#     https://doi.org/10.21105/joss.03887
#
# Note:      Developed to provide a zero-code graphical user interface, 
#            making single-case comparisons easily accessible for clinical 
#            and experimental neuropsychology without compromising scientific rigor.
# =================================================================================================
---
name:  dissocs
title: Dissociation Test
menuTitle: Dissociation Test
menuSubtitle: DISSOCS
menuGroup: SCJ
version: '1.1.1'
jas: '1.2'

options:
    # ---- Basic Input Data ----
    - name: case_a
      title: Case score
      type: Number
      default: 35.0

    - name: case_b
      title: Case score
      type: Number
      default: 48.0

    - name: controls_a
      title: Control mean
      type: Number
      default: 50.0

    - name: controls_b
      title: Control mean
      type: Number
      default: 50.0

    - name: sd_a
      title: Control SD
      type: Number
      default: 10.0
      min: 0.001

    - name: sd_b
      title: Control SD
      type: Number
      default: 10.0
      min: 0.001

    - name: alternative_a
      title: "Task A Expected Direction"
      type: List
      options:
          - name: less
            title: "Less (Case < Control)"
          - name: greater
            title: "Greater (Case > Control)"
      default: less

    - name: alternative_b
      title: "Task B Expected Direction"
      type: List
      options:
          - name: less
            title: "Less (Case < Control)"
          - name: greater
            title: "Greater (Case > Control)"
      default: less
    
    - name: sample_size
      title: Control sample size
      type: Integer
      default: 20
      min: 2

    - name: correlation
      title: Correlation A & B
      type: Number
      default: 0.50
      min: -1.0
      max: 1.0

    # ---- Additional Output ----
    - name: show_plot
      title: Plot
      type: Bool
      default: false
