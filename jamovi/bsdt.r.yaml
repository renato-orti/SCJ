# =================================================================================================
# Module:     BSDT - Single Case Comparison
# File:       bsdt.r.yaml (Results Configuration)
# Purpose:    Output layout and tables definition for executing bayesian single-case 
#             standardised difference tests using the singcar package (Rittmo & McIntosh, 2021) in Jamovi.
# 
# Authors:
#   - Michela Possenti
#     Affiliation: University of Campania "L. Vanvitelli"
#     ORCID: https://orcid.org/0000-0001-8937-0611 | Scopus ID: 57215597427
#
#   - Renato Orti
#     Affiliation: University of Padova
#     ORCID: https://orcid.org/0000-0002-6856-7981 | Scopus ID: 57218222421
# =================================================================================================
---
name:  bsdt
title: Bayesian Standardised Difference Test
jrs:   '1.1'

refs:
  - singcar
  - crawfordgarthwaite2007

items:
  - name: resultsTable
    title: Bayesian Standardised Difference Test (BSDT) - Single Case Comparison
    type: Table
    rows: 1
    clearWith:
      - case_a
      - case_b
      - controls_a
      - controls_b
      - sd_a
      - sd_b
      - sample_size
      - correlation
      - alternative
      - unstandardised
      - credible_interval
      - credible_level
      - iter
      - seed

    columns:
      - name: z_cc_a
        title: Z-CC (Task A)
        type: number
        format: zto
        
      - name: z_cc_b
        title: Z-CC (Task B)
        type: number
        format: zto

      - name: z_dcc
        title: Z-DCC
        type: number
        format: zto

      - name: df
        title: df
        type: integer
        
      - name: p_val
        title: p
        type: number
        format: zto,pvalue
        
      - name: point_estim
        title: Abnormality (%)
        type: number
        format: zto

      - name: ci_lower
        title: Lower
        type: number
        format: zto
        superTitle: Credible Interval
        visible: (credible_interval)

      - name: ci_upper
        title: Upper
        type: number
        format: zto
        superTitle: Credible Interval
        visible: (credible_interval)

  - name: plot
    title: Case vs Controls Score Profiles
    type: Image
    width: 500
    height: 350
    renderFun: .plot
    visible: (show_plot)
    clearWith:
      - case_a
      - case_b
      - controls_a
      - controls_b
      - sd_a
      - sd_b
