# =================================================================================================
# Module:    BSDT - Single Case Comparison
# File:      bsdt.a.yaml (UI Configuration)
# Purpose:   Graphical user interface for executing single-case deficit tests
#            using the singcar package (Rittmo & McIntosh, 2021) in Jamovi.
# 
# Authors:
#   - Michela Possenti
#     Affiliation: University of Campania "L. Vanvitelli"
#     ORCID: https://orcid.org/0000-0001-8937-0611 | Scopus ID: 57215597427
#
#   - Renato Orti
#     Affiliation: University of Padova
#     ORCID: https://orcid.org/0000-0002-6856-7981 | Scopus ID: 57218222421
#
# References:
#   - Crawford, J. R., & Garthwaite, P. H. (2007). Comparison of a single case 
#     to a control or normative sample in neuropsychology: Development of a Bayesian approach. 
#     Cognitive Neuropsychology, 24(4), 343-372.
#     https://doi.org/10.1080/02643290701290146
#
#   - Rittmo J.Ö., & McIntosh R.D. (2021). singcar: Comparing single cases 
#     to small samples in R. Journal of Open Source Software, 6(68), 3887. 
#     https://doi.org/10.21105/joss.03887
#
# Note:      Developed to provide a zero-code graphical user interface, 
#            making single-case comparisons easily accessible for clinical 
#            and experimental neuropsychology without compromising scientific rigor.
# =================================================================================================
---
name:  bsdt
title: Bayesian Standardised Difference Test
menuTitle: Bayesian Standardised Difference Test
menuSubtitle: BSDT
menuGroup: SCJ
version: '1.1.1'
jas: '1.2'

options:
    # ---- Basic Input Data ----
    - name: case_a
      title: Case score
      type: Number
      default: 35.0
      
    - name: case_b
      title: Case score
      type: Number
      default: 48.0
      
    - name: controls_a
      title: Control mean
      type: Number
      default: 50.0
      
    - name: controls_b
      title: Control mean
      type: Number
      default: 50.0
    
    - name: sd_a
      title: Control SD
      type: Number
      default: 10.0
      min: 0.001
      
    - name: sd_b
      title: Control SD
      type: Number
      default: 10.0
      min: 0.001
      
    - name: sample_size
      title: Control sample size
      type: Integer
      default: 20
      min: 4
      
    - name: correlation
      title: Correlation A & B
      type: Number
      default: 0.50
      min: -1.0
      max: 1.0

    # ---- Hypothesis Testing ----
    - name: alternative
      title: Hypothesis testing
      type: List
      options:
        - name: two.sided
          title: Two-sided (A − B in case ≠ controls)
        - name: less
          title: Task A lower than task B, relative to controls
        - name: greater
          title: Task A higher than task B, relative to controls
      default: two.sided
      
    # ---- Advanced Input Data ----
    - name: unstandardised
      title: Use unstandardised scores
      type: Bool
      default: false
    
    - name: credible_interval
      title: Credible interval
      type: Bool
      default: true
      
    - name: credible_level
      title: Credible level (%)
      type: Integer
      default: 95
      min: 50
      max: 99
      
    - name: iter
      title: Iterations
      type: Integer
      default: 10000
      min: 1000
      max: 10000000
      
    - name: seed
      title: Seed
      type: Integer
      default: 42
      min: 1
      
    # ---- Additional Output ----
    - name: show_plot
      title: Plot
      type: Bool
      default: false
