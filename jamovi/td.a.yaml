# =================================================================================================
# Module:    TD - Single Case Comparison
# File:      td.a.yaml (UI Configuration)
# Purpose:   Graphical user interface for executing single-case deficit tests
#            using the singcar package (Rittmo & McIntosh, 2021) in Jamovi.
# 
# Authors:
#   - Michela Possenti
#     Affiliation: University of Campania "L. Vanvitelli"
#     ORCID: https://orcid.org/0000-0001-8937-0611 | Scopus ID: 57215597427
#
#   - Renato Orti
#     Affiliation: University of Padova
#     ORCID: https://orcid.org/0000-0002-6856-7981 | Scopus ID: 57218222421
#
# References:
#   - Crawford, J. R., & Howell, D. C. (1998). Comparing an Individual's Test 
#     Score Against Norms Derived from Small Samples. The Clinical 
#     Neuropsychologist, 12(4), 482-486.
#     https://doi.org/10.1076/clin.12.4.482.7241
#
#   - Rittmo J.Ö., & McIntosh R.D. (2021). singcar: Comparing single cases 
#     to small samples in R. Journal of Open Source Software, 6(68), 3887. 
#     https://doi.org/10.21105/joss.03887
#
# Note:      Developed to provide a zero-code graphical user interface, 
#            making single-case comparisons easily accessible for clinical 
#            and experimental neuropsychology without compromising scientific rigor.
# =================================================================================================
---
name:  td
title: Test of Deficit
menuTitle: Test of Deficit
menuSubtitle: TD
menuGroup: SCJ
version: '1.1.1'
jas: '1.2'

options:
    # ---- Basic Input Data ----
    - name: case                 # Case Score (namely "case" in singcar::TD)
      title: Case score
      type: Number
      default: 35.0
      
    - name: controls             # Controls Score (namely "controls" in singcar::TD)
      title: Control mean
      type: Number
      default: 50.0
      
    - name: sd                   # SD of controls Score (namely "sd" in singcar::TD)
      title: Control SD
      type: Number
      default: 10.0
      min: 0.001
      
    - name: sample_size          # Sample size of controls (namely "sample_size" in singcar::TD)
      title: Control sample size
      type: Integer
      default: 20
      min: 2
    
    # ---- Hypothesis Testing ----
    - name: alternative
      title: Hypothesis testing
      type: List
      options:
        - name: two.sided
          title: Two-sided (case score ≠ control)
        - name: less
          title: Case score lower than control
        - name: greater
          title: Case score greater than control
      default: two.sided  
    
    # ---- Advanced Input Data ----
    - name: confidence_interval  # Confidence interval toggle
      title: Confidence interval
      type: Bool
      default: true
      
    - name: confidence_level     # Level of confidence (namely "conf_level" in singcar::TD)   
      title: Confidence level (%)
      type: Integer
      default: 95
      min: 50
      max: 99
      
    # ---- Additional Output ----
    - name: show_plot            # Command for graph output
      title: Plot
      type: Bool
      default: false
