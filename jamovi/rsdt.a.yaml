# =================================================================================================
# Module:    RSDT - Single Case Comparison
# File:      rsdt.a.yaml (UI Configuration)
# Purpose:   Graphical user interface for executing single-case deficit tests
#            using the singcar package (Rittmo & McIntosh, 2021) in Jamovi.
# 
# Authors:
#
#   - Michela Possenti
#     Affiliation: University of Campania "L. Vanvitelli"
#     ORCID: https://orcid.org/0000-0001-8937-0611 | Scopus ID: 57215597427
#
#   - Renato Orti
#     Affiliation: University of Padova
#     ORCID: https://orcid.org/0000-0002-6856-7981 | Scopus ID: 57218222421
#
# References:
#     Crawford, J. R., & Garthwaite, P. H. (2005). Testing for Suspected Impairments and Dissociations
#     in Single-Case Studies in Neuropsychology: Evaluation of Alternatives Using Monte Carlo
#     Simulations and Revised Tests for Dissociations. Neuropsychology, 19(3), 318 - 331.
#     https://doi.org/10.1037/0894-4105.19.3.318
#
#   - Rittmo J.Ö., & McIntosh R.D. (2021). singcar: Comparing single cases 
#     to small samples in R. Journal of Open Source Software, 6(68), 3887. 
#     https://doi.org/10.21105/joss.03887
#
# Note:      Developed to provide a zero-code graphical user interface, 
#            making single-case comparisons easily accessible for clinical 
#            and experimental neuropsychology without compromising scientific rigor.
# =================================================================================================
---
name:  rsdt
title: RSDT
menuGroup: SCJ
version: '1.0.0'
jas: '1.2'

options:
    - name: case_a                 # Case Score on Task A (namely "case_a" in singcar::RSDT)
      title: Case Score Task A
      type: Number
      default: 0
      
    - name: case_b                 # Case Score on Task A (namely "case_b" in singcar::RSDT)
      title: Case Score Task B
      type: Number
      default: 0
      
    - name: controls_a             # Controls Score on Task A (namely "controls_a" in singcar::RSDT)
      title: Controls Mean Task A
      type: Number
      default: 0
      
    - name: controls_b             # Controls Score on Task B (namely "controls_b" in singcar::RSDT)
      title: Controls Mean Task B
      type: Number
      default: 0
    
    - name: sd_a                   # SD of controls Score on Task A (namely "sd_a" in singcar::RSDT)
      title: Controls SD Task A
      type: Number
      default: 0
      
    - name: sd_b                   # SD of controls Score on Task B (namely "sd_b" in singcar::RSDT)
      title: Controls SD Task B
      type: Number
      default: 0
      
    - name: sample_size            # Sample size of controls (namely "sample_size" in singcar::RSDT)
      title: Controls Sample Size
      type: Integer
      default: 0
      
    - name: correlation            # SD of controls Score on Task B (namely "sd_b" in singcar::RSDT)
      title: Correlation A & B 
      type: Number
      default: 0
      
    - name: alternative            # Alternative hypothesis (namely "alternative" in singcar::RSDT)
      title: Hypothesis
      type: List
      options:
       - name: "two.sided"
         title: "Two Sided (Case ≠ Control)"
       - name: "less"
         title: "Less (Case < Control)"
       - name: "greater"
         title: "Greater (Case > Control)" 
      default: "less"
      
    - name: show_plot              # Command to generate a plot of the test
      title: Show plot
      type: Bool
      default: false
    
    - name: show_txt_output        # Command for text output   
      title: Text output
      type: Bool
      default: false