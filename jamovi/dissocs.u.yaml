---
name: dissocs
title: Dissociation Test
jus: '3.0'
compilerMode: tame

children:
  # ---- Paired Task Parameters (Isolated Two-Column Grid) ----
  - type: LayoutBox
    margin: normal
    children:
      - type: LayoutBox
        cell: { column: 0, row: 0 }
        children:
          - type: Label
            label: Task A Parameters
            children:
              - type: TextBox
                name: case_a
                format: number
              - type: TextBox
                name: controls_a
                format: number
              - type: TextBox
                name: sd_a
                format: number

      - type: LayoutBox
        cell: { column: 1, row: 0 }
        children:
          - type: Label
            label: Task B Parameters
            children:
              - type: TextBox
                name: case_b
                format: number
              - type: TextBox
                name: controls_b
                format: number
              - type: TextBox
                name: sd_b
                format: number

  # ---- Control Sample & Hypotheses (Linear Vertical Layout) ----
  - type: LayoutBox
    margin: large
    children:
      - type: Label
        label: Control Sample Statistics
        children:
          - type: TextBox
            name: sample_size
            format: number
          - type: TextBox
            name: correlation
            format: number

      - type: Label
        label: Hypothesis Testing
        children:
          - type: ComboBox
            name: alternative_a
          - type: ComboBox
            name: alternative_b

  # ---- Additional Output ----
  - type: CollapseBox
    label: Additional Output
    collapsed: true
    children:
      - type: LayoutBox
        margin: normal
        children:
          - type: CheckBox
            name: show_plot
          - type: CheckBox
            name: show_txt_output