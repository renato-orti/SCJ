---
name: rsdt
title: Revised Standardised Difference Test
jus: '3.0'
compilerMode: tame

children:
  # ---- Paired Task Parameters (Two-Column Grid Layout) ----
  - type: LayoutBox
    cell: { column: 0, row: 0 }
    children:
      - type: Label
        label: Task A parameters
        children:
          - type: TextBox
            name: case_a
            format: number
          - type: TextBox
            name: controls_a
            format: number
          - type: TextBox
            name: sd_a
            format: number

  - type: LayoutBox
    cell: { column: 1, row: 0 }
    children:
      - type: Label
        label: Task B parameters
        children:
          - type: TextBox
            name: case_b
            format: number
          - type: TextBox
            name: controls_b
            format: number
          - type: TextBox
            name: sd_b
            format: number

  # ---- Control Sample Statistics ----
  - type: LayoutBox
    cell: { column: 0, row: 1 }
    children:
      - type: Label
        label: Control sample statistics
        children:
          - type: TextBox
            name: sample_size
            format: number
          - type: TextBox
            name: correlation
            format: number

  # ---- Hypothesis Testing ----
  - type: LayoutBox
    cell: { column: 0, row: 2 }
    children:
      - type: Label
        label: Hypothesis testing
        children:
          - type: RadioButton
            name: alternative_two_sided
            optionName: alternative
            optionPart: two.sided
          - type: RadioButton
            name: alternative_less
            optionName: alternative
            optionPart: less
          - type: RadioButton
            name: alternative_greater
            optionName: alternative
            optionPart: greater

  # ---- Additional Output ----
  - type: CollapseBox
    label: Additional output
    collapsed: true
    children:
      - type: LayoutBox
        margin: normal
        children:
          - type: CheckBox
            name: show_plot
