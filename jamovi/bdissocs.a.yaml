# =================================================================================================
# Module:    BDISSOCS - Single Case Comparison
# File:      bdissocs.a.yaml (UI Configuration)
# Purpose:   Graphical user interface for executing single-case deficit tests
#            using the singcar package (Rittmo & McIntosh, 2021) in Jamovi.
# 
# Authors:
#
#   - Michela Possenti
#     Affiliation: University of Campania "L. Vanvitelli"
#     ORCID: https://orcid.org/0000-0001-8937-0611 | Scopus ID: 57215597427
#
#   - Renato Orti
#     Affiliation: University of Padova
#     ORCID: https://orcid.org/0000-0002-6856-7981 | Scopus ID: 57218222421
#
# References:
#   - Crawford, J. R. & Garthwaite, P.H. (2005). Testing for suspected impairments and dissociations 
#     in single-case studies in neuropsychology: Evaluation of alternatives using Monte Carlo 
#     simulations and revised tests for dissociations”.  Neuropsychology, 19, 318-331.
#     https://doi.org/10.1037/0894-4105.19.3.318
#
#   - Crawford, J. R., & Garthwaite, P. H. (2007). Comparison of a single case 
#     to a control or normative sample in neuropsychology: Development of a Bayesian approach. 
#     Cognitive Neuropsychology, 24(4), 343-372.
#     https://doi.org/10.1080/02643290701290146
#
#   - Rittmo J.Ö., & McIntosh R.D. (2021). singcar: Comparing single cases 
#     to small samples in R. Journal of Open Source Software, 6(68), 3887. 
#     https://doi.org/10.21105/joss.03887
#
# Note:      Developed to provide a zero-code graphical user interface, 
#            making single-case comparisons easily accessible for clinical 
#            and experimental neuropsychology without compromising scientific rigor.
# =================================================================================================
---
name:  bdissocs
title: Bayesian Dissociation Test
menuTitle: Bayesian Dissociation Test
menuSubtitle: B-DISSOCS
menuGroup: SCJ
version: '1.1.1'
jas: '1.2'

options:
    # ---- Basic Input Data ----
    - name: case_a                 # Case Score on Task A (namely "case_a" in singcar::BSDT)
      title: Case score
      type: Number
      default: 35.0
      
    - name: case_b                 # Case Score on Task A (namely "case_b" in singcar::BSDT)
      title: Case score
      type: Number
      default: 48.0
      
    - name: controls_a             # Controls Score on Task A (namely "controls_a" in singcar::BSDT)
      title: Control mean
      type: Number
      default: 50.0
      
    - name: controls_b             # Controls Score on Task B (namely "controls_b" in singcar::BSDT)
      title: Control mean
      type: Number
      default: 50.0
    
    - name: sd_a                   # SD of controls Score on Task A (namely "sd_a" in singcar::BSDT)
      title: Control SD
      type: Number
      default: 10.0
      min: 0.001
      
    - name: sd_b                   # SD of controls Score on Task B (namely "sd_b" in singcar::BSDT)
      title: Control SD
      type: Number
      default: 10.0
      min: 0.001
      
    - name: alternative_a          # Alternative hypothesis on task A (namely "alternative" in singcar::BSDT)
      title: "Task A expected direction"
      type: List
      options:
          - name: less
            title: "Less (case < control)"
          - name: greater
            title: "Greater (case > control)"
      default: less

    - name: alternative_b          # Alternative hypothesis on task B (namely "alternative" in singcar::BSDT)
      title: "Task B expected direction"
      type: List
      options:
          - name: less
            title: "Less (case < control)"
          - name: greater
            title: "Greater (case > control)"
      default: less
      
    - name: sample_size            # Sample size of controls (namely "sample_size" in singcar::BSDT)
      title: Controls sample size
      type: Integer
      default: 20
      min: 4
      
    - name: correlation            # SD of controls Score on Task B (namely "sd_b" in singcar::BSDT)
      title: Correlation A & B
      type: Number
      default: 0.50
      min: -1.0
      max: 1.0
    
    # ---- Advanced Input Data ----
    - name: unstandardised         # Command to estimate z-value based on standardised or unstandardised task score
      title: Unstandardised scores (tasks on the same scale)
      type: Bool
      default: false
      
    - name: credible_interval      # Credibile interval
      title: Credible interval
      type: Bool
      default: true
      
    - name: credible_level         # Level of credibility (namely "int_level" in singcar::BSDT)   
      title: Credible level (%)
      type: Integer
      default: 95
      min: 50
      max: 99
      
    - name: iter                   # Number of iterations (namely "iter" in singcar::BSDT)
      title: Iterations
      type: Integer
      default: 10000
      min: 1000
      max: 10000000
      
    - name: seed                   # Random seed for reproducibility
      title: Seed
      type: Integer
      default: 42
      min: 1

    # ---- Additional Output ----
    - name: show_plot              # Command to generate a plot of the test
      title: Plot
      type: Bool
      default: false