---
name: btd
title: Bayesian Test of Deficit
jus: '3.0'
compilerMode: tame

children:
  # ---- Single Task Parameters ----
  - type: LayoutBox
    margin: large
    children:
      - type: Label
        label: Task Parameters
        children:
          - type: TextBox
            name: case
            format: number
          - type: TextBox
            name: controls
            format: number
          - type: TextBox
            name: sd
            format: number

      - type: Label
        label: Control Sample Statistics
        children:
          - type: TextBox
            name: sample_size
            format: number

      - type: Label
        label: Hypothesis Testing
        children:
          - type: RadioButton
            name: alternative_two_sided
            optionName: alternative
            optionPart: two.sided
          - type: RadioButton
            name: alternative_less
            optionName: alternative
            optionPart: less
          - type: RadioButton
            name: alternative_greater
            optionName: alternative
            optionPart: greater

  # ---- Advanced Simulation & Scale Options ----
  - type: CollapseBox
    label: Simulation
    collapsed: true
    children:
      - type: LayoutBox
        margin: normal
        children:
          - type: CheckBox
            name: credible_interval
          - type: TextBox
            name: credible_level
            format: number
            enable: (credible_interval)
          - type: TextBox
            name: iter
            format: number
          - type: TextBox
            name: seed
            format: number

  # ---- Additional Output ----
  - type: CollapseBox
    label: Additional Output
    collapsed: true
    children:
      - type: LayoutBox
        margin: normal
        children:
          - type: CheckBox
            name: show_plot
