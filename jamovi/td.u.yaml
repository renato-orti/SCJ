---
name: td
title: Test of Deficit
jus: '3.0'
compilerMode: tame

children:
  # ---- Single Task Parameters ----
  - type: LayoutBox
    margin: large
    children:
      - type: Label
        label: Task parameters
        children:
          - type: TextBox
            name: case
            format: number
          - type: TextBox
            name: controls
            format: number
          - type: TextBox
            name: sd
            format: number

      - type: Label
        label: Control sample statistics
        children:
          - type: TextBox
            name: sample_size
            format: number

      - type: Label
        label: Hypothesis testing
        children:
          - type: RadioButton
            name: alternative_two_sided
            optionName: alternative
            optionPart: two.sided
          - type: RadioButton
            name: alternative_less
            optionName: alternative
            optionPart: less
          - type: RadioButton
            name: alternative_greater
            optionName: alternative
            optionPart: greater

  # ---- Advanced Options ----
  - type: CollapseBox
    label: Advanced options
    collapsed: true
    children:
      - type: LayoutBox
        margin: normal
        children:
          - type: CheckBox
            name: confidence_interval
          - type: TextBox
            name: confidence_level
            format: number
            enable: (confidence_interval)

  # ---- Additional Output ----
  - type: CollapseBox
    label: Additional output
    collapsed: true
    children:
      - type: LayoutBox
        margin: normal
        children:
          - type: CheckBox
            name: show_plot
